<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="/src/styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Diff of Services</title>
    <script type="module" src="/src/main.ts" defer></script>
  </head>

  <body>
    <div>
      <label for="document">Document</label>
      <select id="documents"> </select>
    </div>

    <div>
      <label for="revision">Revision</label>
      <select id="revisions"> </select>
    </div>

    <form id="add-document-form">
      <label>Document Name</label>
      <input type="text" id="add-document-name"/>
      <input type="submit" value="Add document">
    </form>

    <form id="add-revision-form">
      <label for="revision-file">Revision Text File</label>
      <input name="revision-file" id="revision-file" type="file" />
      <input type="submit" value="Add Revision">
    </form>

    <div id="diff-type">
      <input type="radio" id="no-diff" name="diff-type" value="none" checked/>
      <label for="no-diff">None</label>
      <input type="radio" id="inline-diff" name="diff-type" value="inline" />
      <label for="inline-diff">Inline</label>
      <input type="radio" id="2col-diff" name="diff-type" value="2col" />
      <label for="2col-diff">Side-by-Side</label>
    </div>
    <div id="document-revision-text" />
  </body>
</html>
