name: Flake Check and Test

'on':
  push:
    branches:
    - master
  workflow_dispatch: { }

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - uses: DeterminateSystems/nix-installer-action@v22
    - name: Check flake and test
      run: nix -Lv flake check --build-all
