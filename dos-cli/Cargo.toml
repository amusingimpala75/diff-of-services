[package]
name = "dos-cli"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.102"
clap = { version = "4.6.0", features = ["derive"] }
clap_complete = "4.6.2"
clap_mangen = "0.3.0"
dos-lib = { version = "0.1.0", path = "../dos-lib" }
rusqlite = { version = "0.39.0", features = ["time"] }
time = { version = "0.3.47", features = ["local-offset"] }
